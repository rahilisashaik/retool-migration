services:
  # Web Service
  - type: web
    name: retool-migration
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: retool-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: retool-redis
          property: connectionString
      - key: NEXTAUTH_URL
        value: https://retool-migration.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  # PostgreSQL Database
  - type: pserv
    name: retool-db
    plan: free
    databaseName: platform_db
    user: platform_user

  # Redis Instance
  - type: redis
    name: retool-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
